name: Update Latest Base Rate Issues

on:
  schedule:
    # Sunday 6pm and Monday 9am Central (UTC), after the Sunday send
    - cron: "0 23 * * 0"
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch feed
        run: python scripts/fetch_issues.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/base-rate-issues.json
          git diff --staged --quiet || (git commit -m "newsletter: refresh latest issues [skip actions]" && git push)
