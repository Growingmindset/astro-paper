name: Update Macro Thesis Table

on:
  schedule:
    - cron: '0 13 16 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_thesis.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/thesis_state.json src/data/blog/2026-portfolio-log.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "macro: auto monthly update [skip ci]" && git push)
